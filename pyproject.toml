[project]
name = "ragnavigator"
version = "0.1.0"
description = "A catalog site whose assistant answers questions and takes you to where the answer lives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jpmenach", email = "jpablo.menachoc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "fpdf2>=2.8.9",
    "ragstarter",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ragstarter = { path = "../ragstarter", editable = true }

[tool.alembic]
script_location = "migrations"
